<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل فعاليات SVU - اتصل بنا</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="custom.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif !important;
            background-color: #121212;
            color: #e0e0e0;
        }
        .navbar, .footer {
            background-color: #1f1f1f !important;
        }
        .card {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            height: auto !important; /* لضمان تمدد البطاقة لجميع الحقول */
        }
        .form-control, .form-control:focus {
            background-color: #2a2a2a;
            color: #fff !important;
            border-color: #444;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: none;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- شريط التنقل الموحد -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-mortarboard-fill"></i> دليل فعاليات SVU
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">الفعاليات</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">عن الدليل</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">اتصل بنا</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card p-4 shadow-lg">
                    <h2 class="fw-bold text-white mb-3 text-center"><i class="bi bi-envelope-fill text-primary"></i> تواصل معنا</h2>
                    <p class="text-muted text-center mb-4 small">لديك استفسار أو اقتراح؟ يسعدنا تواصلك معنا.</p>
                    
                    <form onsubmit="event.preventDefault(); alert('تم إرسال رسالتك بنجاح!');">
                        <!-- 1. حقل الاسم -->
                        <div class="mb-3">
                            <label for="name" class="form-label text-light fw-bold">الاسم الكامل</label>
                            <input type="text" class="form-control" id="name" placeholder="أدخل اسمك الكامل..." required>
                        </div>
                        
                        <!-- 2. حقل البريد الإلكتروني -->
                        <div class="mb-3">
                            <label for="email" class="form-label text-light fw-bold">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" placeholder="example@svuonline.org" required>
                        </div>

                        <!-- 3. حقل نص الرسالة -->
                        <div class="mb-3">
                            <label for="message" class="form-label text-light fw-bold">نص الرسالة</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="اكتب رسالتك أو اقتراحك هنا..." required></textarea>
                        </div>

                        <!-- 4. زر الإرسال -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary fw-bold py-2">إرسال الرسالة</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    
    <footer class="footer text-center py-3 mt-auto text-muted">
        <p class="mb-0">&copy; 2026 دليل فعاليات الجامعة الافتراضية السورية (SVU)</p>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
